name: Build Flask APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev
      - name: Install buildozer
        run: pip install "cython==0.29.33" buildozer
      - name: Build
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
          echo "--- TAIL LOG ---"
          tail -n 300 build.log
          find . -name "*.apk"
        env:
          ACCEPT: "1"
          P4A_ACCEPT_SDK_LICENSE_AGREEMENTS: "1"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cipher-apk
          path: |
            **/*.apk
            ./bin/*.apk
            build.log
