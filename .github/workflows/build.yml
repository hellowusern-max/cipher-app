name: Build Kivy APK - Debug

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt update -y
          sudo apt install -y openjdk-17-jdk zip unzip git python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 libreadline-dev libssl-dev libffi-dev \
          libsqlite3-dev libbz2-dev libltdl-dev libjpeg-dev libfreetype6-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.33" buildozer

      - name: Build APK
        run: |
          yes | buildozer android debug --verbose
        env:
          P4A_ACCEPT_SDK_LICENSE_AGREEMENTS: "1"

      - name: ALWAYS Show Logs and Find APK
        if: always()
        run: |
          echo "===== LAST 100 LINES OF BUILD LOG ====="
          cat ~/.buildozer/logs/buildozer.log | tail -n 150 || echo "no buildozer.log"
          echo "===== SEARCH APK EVERYWHERE ====="
          find . -type f -name "*.apk" -o -name "*.aab" | head -20
          echo "===== LIST BIN FOLDER ====="
          ls -lahR | grep -E "bin|.apk" | head -30

      - name: Upload APK if exists
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            bin/*.apk
            **/*.apk
