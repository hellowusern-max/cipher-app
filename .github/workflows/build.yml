name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git \
          libltdl-dev libffi-dev libssl-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer

      - name: Build APK
        run: |
          yes | buildozer -v android debug
        env:
          P4A_ACCEPT_SDK_LICENSE_AGREEMENTS: "1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cipher-apk
          path: bin/*.apk
